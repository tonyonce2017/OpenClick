name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build -c Release

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: dotnet publish src/OpenClick -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "OpenClick-$tag-win-x64.zip"
          Compress-Archive -Path "src/OpenClick/bin/Release/net10.0-windows/win-x64/publish/OpenClick.exe" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -Path "$zip.sha256" -Encoding ascii -NoNewline
      - uses: actions/upload-artifact@v4
        with:
          name: OpenClick-win-x64
          path: |
            OpenClick-*-win-x64.zip
            OpenClick-*-win-x64.zip.sha256
      - name: Create or update the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "OpenClick-$tag-win-x64.zip"
          $notes = "docs/release-notes/$tag.md"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; uploading assets with --clobber."
            gh release upload $tag $zip "$zip.sha256" --clobber
          } elseif (Test-Path $notes) {
            gh release create $tag $zip "$zip.sha256" --title "OpenClick $tag" --notes-file $notes
          } else {
            gh release create $tag $zip "$zip.sha256" --title "OpenClick $tag" --generate-notes
          }
